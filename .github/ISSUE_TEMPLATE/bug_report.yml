name: Bug Report
description: Report a reproducible defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve role-node. Do not include secrets, tokens, or private data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Include commands, requests, payload shape, or migration state if relevant.
      placeholder: |
        1. Start the API with ...
        2. Send request ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, Commit, Or Tag
      placeholder: v1.0.0 or commit SHA
  - type: input
    id: node
    attributes:
      label: Node.js Version
      placeholder: v22.x
  - type: input
    id: database
    attributes:
      label: Postgres Version
      placeholder: PostgreSQL 16
  - type: textarea
    id: logs
    attributes:
      label: Logs Or Additional Context
      description: Redact secrets before pasting logs.
