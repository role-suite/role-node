name: Setup Node.js and pnpm
description: >
  Sets up pnpm (version read from package.json's "packageManager" field - no hardcoded version
  here, so it can never drift out of sync) and Node.js with the pnpm store cached.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
