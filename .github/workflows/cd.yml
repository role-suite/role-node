name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment target"
        required: true
        default: production
        type: choice
        options:
          - production

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  verify-ci:
    name: Verify CI for ref
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Wait for CI status check to pass
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const expectedName = 'CI / CI Status';
            const ref = context.sha;
            const timeoutMs = 15 * 60 * 1000;
            const intervalMs = 20 * 1000;
            const started = Date.now();

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (Date.now() - started < timeoutMs) {
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const ciRun = checks.data.check_runs.find((run) => run.name === expectedName);

              if (!ciRun) {
                core.info(`Waiting for '${expectedName}' check run on ${ref}...`);
                await sleep(intervalMs);
                continue;
              }

              core.info(`Found '${expectedName}' with status='${ciRun.status}' conclusion='${ciRun.conclusion}'`);

              if (ciRun.status !== 'completed') {
                await sleep(intervalMs);
                continue;
              }

              if (ciRun.conclusion !== 'success') {
                core.setFailed(`CI gate failed: '${expectedName}' concluded with '${ciRun.conclusion}' for ${ref}`);
              }

              return;
            }

            core.setFailed(`Timed out waiting for '${expectedName}' to complete on ${ref}`);

  publish-image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: verify-ci
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: publish-image
    if: >-
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'production'))
    environment: production
    env:
      PRODUCTION_DEPLOY_WEBHOOK_URL: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Validate production webhook secret
        run: |
          if [ -z "$PRODUCTION_DEPLOY_WEBHOOK_URL" ]; then
            echo "Missing required secret: PRODUCTION_DEPLOY_WEBHOOK_URL"
            exit 1
          fi

      - name: Trigger production deployment webhook
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"image":"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.publish-image.outputs.image_tag }}","sha":"${{ github.sha }}"}' \
            "$PRODUCTION_DEPLOY_WEBHOOK_URL"

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish-image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
