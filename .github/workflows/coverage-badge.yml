name: Coverage Badge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    name: update-badge
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 10
    env:
      NODE_ENV: test
      PORT: 3000
      DB_DIALECT: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: role_user
      DB_PASSWORD: role_pass
      DB_NAME: role_node
      DB_POOL_MIN: 0
      DB_POOL_MAX: 10
      DB_SSL: "false"
      ENABLE_STARTUP_VALIDATION: "false"
      AUTH_ACCESS_TOKEN_SECRET: test-access-secret-123456
      AUTH_REFRESH_TOKEN_SECRET: test-refresh-secret-123456
      AUTH_ACCESS_TOKEN_TTL_SECONDS: 900
      AUTH_REFRESH_TOKEN_TTL_SECONDS: 604800

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Read coverage percentage
        id: coverage
        run: |
          node -e "const fs=require('node:fs'); const s=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')); const p=Math.round(s.total.lines.pct); const c=p>=90?'green':p>=80?'yellow':p>=70?'orange':'red'; fs.appendFileSync(process.env.GITHUB_OUTPUT, `pct=${p}\ncolor=${c}\n`);"

      - name: Generate coverage badge
        uses: emibcn/badge-action@v2
        with:
          label: coverage
          status: ${{ steps.coverage.outputs.pct }}%
          color: ${{ steps.coverage.outputs.color }}
          path: badges/coverage.svg

      - name: Commit updated coverage badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update coverage badge"
          file_pattern: badges/coverage.svg
