name: Release Tag

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semantic version bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  create-tag:
    name: Create semantic version tag
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Release tags can only be created from main."
          exit 1

      - name: Calculate next semantic tag
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const releaseType = '${{ github.event.inputs.release_type }}'
            const { owner, repo } = context.repo

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            })

            const semverTagRegex = /^v(\d+)\.(\d+)\.(\d+)$/
            const semverTags = tags
              .map((tag) => {
                const match = tag.name.match(semverTagRegex)
                if (!match) return null
                return {
                  name: tag.name,
                  major: Number(match[1]),
                  minor: Number(match[2]),
                  patch: Number(match[3]),
                }
              })
              .filter(Boolean)
              .sort((a, b) => {
                if (a.major !== b.major) return b.major - a.major
                if (a.minor !== b.minor) return b.minor - a.minor
                return b.patch - a.patch
              })

            const current = semverTags[0] || { major: 0, minor: 0, patch: 0 }
            const next = {
              major: current.major,
              minor: current.minor,
              patch: current.patch,
            }

            if (releaseType === 'major') {
              next.major += 1
              next.minor = 0
              next.patch = 0
            } else if (releaseType === 'minor') {
              next.minor += 1
              next.patch = 0
            } else {
              next.patch += 1
            }

            const nextTag = `v${next.major}.${next.minor}.${next.patch}`
            core.setOutput('next_tag', nextTag)
            core.notice(`Next release tag: ${nextTag}`)

      - name: Create annotated tag on current commit
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const tagName = '${{ steps.version.outputs.next_tag }}'
            const commitSha = context.sha

            const createdTag = await github.rest.git.createTag({
              owner,
              repo,
              tag: tagName,
              message: `Release ${tagName}`,
              object: commitSha,
              type: 'commit',
            })

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tagName}`,
              sha: createdTag.data.sha,
            })

            core.notice(`Created tag ${tagName} at ${commitSha}`)
