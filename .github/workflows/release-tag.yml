name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semantic version bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  version-and-release:
    name: Bump version, tag, and release
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Ensure workflow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases can only be created from main."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test:run && pnpm build

      - name: Calculate next version
        id: version
        run: |
          node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const type='${{ github.event.inputs.release_type }}'; const [maj,min,pat]=pkg.version.split('.').map(Number); const next= type==='major' ? [maj+1,0,0] : type==='minor' ? [maj,min+1,0] : [maj,min,pat+1]; const v=next.join('.'); fs.appendFileSync(process.env.GITHUB_OUTPUT, `next_version=${v}\nnext_tag=v${v}\n`);"

      - name: Update package version
        run: pnpm version ${{ steps.version.outputs.next_version }} --no-git-tag-version

      - name: Update changelog
        run: |
          RELEASE_DATE="$(date -u +%Y-%m-%d)"
          RELEASE_TAG="${{ steps.version.outputs.next_tag }}"
          RELEASE_VERSION="${{ steps.version.outputs.next_version }}"
          TMP_FILE="$(mktemp)"
          {
            echo "# Changelog"
            echo
            echo "All notable changes to this project will be documented in this file."
            echo
            echo "The format is based on Keep a Changelog, and this project adheres to Semantic Versioning."
            echo
            echo "## Unreleased"
            echo
            echo "- No changes documented yet."
            echo
            echo "## [${RELEASE_VERSION}] - ${RELEASE_DATE}"
            echo
            echo "- See GitHub release notes for ${RELEASE_TAG}."
            echo
            awk 'BEGIN{copy=0} /^## \[/{copy=1} {if(copy) print}' CHANGELOG.md
          } > "$TMP_FILE"
          mv "$TMP_FILE" CHANGELOG.md

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit versioning changes
        run: |
          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.next_tag }}"

      - name: Push release commit and tag
        run: |
          git tag -a "${{ steps.version.outputs.next_tag }}" -m "Release ${{ steps.version.outputs.next_tag }}"
          git push origin main
          git push origin "${{ steps.version.outputs.next_tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          generate_release_notes: true
