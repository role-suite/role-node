name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  PORT: 3000
  DB_HOST: localhost
  DB_PORT: 6321
  DB_USER: role_user
  DB_PASSWORD: role_pass
  DB_NAME: role_node
  DB_POOL_MIN: 0
  DB_POOL_MAX: 10
  DB_SSL: "false"
  ENABLE_STARTUP_VALIDATION: "false"
  AUTH_ACCESS_TOKEN_SECRET: test-access-secret-123456
  AUTH_REFRESH_TOKEN_SECRET: test-refresh-secret-123456
  AUTH_ACCESS_TOKEN_TTL_SECONDS: 900
  AUTH_REFRESH_TOKEN_TTL_SECONDS: 604800

jobs:
  format:
    name: 1. Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: 2. Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: 3. Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test:run

      - name: Run coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  build:
    name: 4. Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [format, lint, test, build]
    if: always()
    steps:
      - name: Validate all required jobs passed
        run: |
          if [ "${{ needs.format.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
