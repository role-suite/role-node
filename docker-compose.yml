services:
  postgres:
    image: postgres:16
    container_name: role_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: role_user
      POSTGRES_PASSWORD: role_pass
      POSTGRES_DB: role_node
    ports:
      - "5432:5432"
    volumes:
      - role_postgres_data:/var/lib/postgresql/data


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    container_name: role_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./config/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: role_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=5GB"
    volumes:
      - ./config/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - role_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  tempo:
    image: grafana/tempo:2.6.1
    container_name: role_tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - role_tempo_data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.1.1
    container_name: role_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./config/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - role_loki_data:/loki

  grafana:
    image: grafana/grafana:11.1.4
    container_name: role_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - role_grafana_data:/var/lib/grafana
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: role_alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./config/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - role_alertmanager_data:/alertmanager

volumes:
  role_postgres_data:
  role_prometheus_data:
  role_tempo_data:
  role_loki_data:
  role_grafana_data:
  role_alertmanager_data:
