global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity", "slo"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical

receivers:
  - name: default
  - name: critical

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname"]
